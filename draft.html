<!doctype html>
<html><head><meta charset="utf-8"><title>Draft Room</title>
<style>
:root{--bg:#0f1217;--panel:#171c24;--line:#2a3240;--fg:#e6e9ef;--mut:#8a94a6;--acc:#4f8cff;--good:#35c46a;--warn:#f0b429;--bad:#ef5a5a;
--QB:#d65db1;--RB:#35c46a;--WR:#4f8cff;--TE:#f0b429;--K:#9aa4b5;--DST:#9aa4b5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 -apple-system,Inter,Segoe UI,sans-serif}
header{display:flex;gap:18px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-size:15px}.pill{padding:2px 8px;border-radius:10px;background:#232a36;color:var(--mut)}.pill.me{background:#1f3a66;color:#fff}
.clock{font-size:15px}.clock.me{color:var(--good);font-weight:700}
main{display:grid;grid-template-columns:1.25fr 1fr .8fr;gap:10px;padding:10px;height:calc(100vh - 50px)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;display:flex;flex-direction:column;min-height:0}
.box h3{margin:0;padding:8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;position:sticky;top:0;background:var(--panel)}
table{border-collapse:collapse;width:100%}th{font-weight:500;color:var(--mut);text-align:left;padding:5px 7px;font-size:11px;position:sticky;top:31px;background:var(--panel)}
td{padding:5px 7px;border-top:1px solid #1f2530;white-space:nowrap}tr.row:hover{background:#1f2734;cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}.pos{font-weight:700;padding:1px 5px;border-radius:4px;font-size:11px;color:#0f1217}
.QB{background:var(--QB)}.RB{background:var(--RB)}.WR{background:var(--WR)}.TE{background:var(--TE)}.K{background:var(--K)}.DST{background:var(--DST)}
.g{color:var(--good)}.w{color:var(--warn)}.b{color:var(--bad)}.m{color:var(--mut)}
.top1{background:#14301f}.top1 td{font-weight:700;font-size:14px}
input,select,button{background:#232a36;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
button:hover{border-color:var(--acc)}button.danger{border-color:#5a2a2a}
.tabs button{padding:3px 8px;font-size:11px}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sug{position:absolute;background:#232a36;border:1px solid var(--line);border-radius:6px;z-index:10;max-height:260px;overflow:auto;width:360px}
.sug div{padding:5px 8px;cursor:pointer}.sug div.sel,.sug div:hover{background:var(--acc);color:#fff}
.roster td{padding:3px 7px}.empty{color:#4a5262;font-style:italic}
.bar{height:5px;background:#2a3240;border-radius:3px;overflow:hidden;width:56px;display:inline-block;vertical-align:middle;margin-left:4px}.bar i{display:block;height:100%;background:var(--good)}
.status{font-size:11px;color:var(--mut)}.spin{color:var(--warn)}
.log{font-size:11px;color:var(--mut);padding:6px 10px;max-height:110px;overflow:auto}
</style></head><body>
<header>
 <b id="lg"></b>
 <span class="pill">Pick <span id="pick"></span> · Rd <span id="rd"></span></span>
 <span class="clock" id="clock"></span>
 <span class="pill me">Me: slot <select id="slot"></select> · next <span id="next"></span></span>
 <span style="position:relative"><input id="q" placeholder="Type a name, Enter = drafted by team on clock" style="width:360px"><div id="sug" class="sug" hidden></div></span>
 <button id="undo" class="danger">Undo</button>
 <label class="status"><input type="checkbox" id="auto"> auto-sync ESPN</label><button id="sync">Sync now</button>
 <span class="status" id="st"></span>
</header>
<main>
 <section class="box"><h3>Recommendation <span id="recst" class="status"></span></h3>
  <table id="rec"><thead><tr><th>#</th><th>Player</th><th></th><th>Tm</th><th class="num">Bye</th><th class="num">Proj</th><th class="num">vs best</th><th class="num">Lasts to next</th><th class="num">…and after</th><th class="num">ADP</th><th class="num">Tier</th></tr></thead><tbody></tbody></table>
  <div class="log" id="log"></div>
 </section>
 <section class="box"><h3>Best available <span class="tabs" id="tabs"></span></h3>
  <table id="best"><thead><tr><th>Player</th><th></th><th>Tm</th><th class="num">Bye</th><th class="num">Tier</th><th class="num">Proj</th><th class="num">VORP</th><th class="num">ADP</th><th class="num">ECR</th><th class="num">Lasts</th><th></th></tr></thead><tbody></tbody></table>
 </section>
 <section class="box"><h3>My roster <span class="tabs" id="rtabs"></span></h3><div id="roster"></div>
  <h3>Draft log</h3><div id="picks" class="log" style="max-height:none"></div>
 </section>
</main>
<script>
let S=null, posF='ALL', rosterView='me', selIdx=-1;
const $=s=>document.querySelector(s);
const f0=v=>v==null?'–':Math.round(v); const pct=v=>v==null?'<span class="m">–</span>':`<span class="${v>.7?'g':v>.35?'w':'b'}">${Math.round(v*100)}%</span>`;
async function api(p,b){const r=await fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json()}
async function refresh(){S=await api('/api/state');render()}
function teamName(s){return (S.team_names&&S.team_names[s])||`Team ${s}`}
function render(){
 $('#lg').textContent=S.league.name; $('#pick').textContent=S.current_pick; $('#rd').textContent=Math.ceil(S.current_pick/S.league.teams);
 const me=S.on_clock===S.slot; const c=$('#clock'); c.className='clock'+(me?' me':''); c.textContent=S.on_clock?(me?'▶ YOU ARE ON THE CLOCK':`On clock: ${teamName(S.on_clock)} (slot ${S.on_clock})`):'Draft complete';
 $('#next').textContent=S.my_next.join(', ')||'–';
 const sl=$('#slot'); if(sl.options.length!==S.league.teams){sl.innerHTML='';for(let i=1;i<=S.league.teams;i++){sl.innerHTML+=`<option value="${i}">${i}</option>`}} sl.value=S.slot;
 $('#auto').checked=S.autosync; $('#st').innerHTML=S.computing?'<span class="spin">● computing…</span>':'● ready';
 $('#recst').textContent=S.rec_ready?'':'(calculating for this pick…)';
 $('#log').innerHTML=(S.log||[]).join('<br>');
 // recommendation
 const tb=$('#rec tbody'); tb.innerHTML='';
 S.rec.forEach((r,i)=>{tb.innerHTML+=`<tr class="row ${i==0?'top1':''}" onclick="pick(${r.espn_id})"><td>${i+1}</td><td>${r.name}</td><td><span class="pos ${r.pos}">${r.pos}</span></td><td>${r.nfl}</td><td class="num">${f0(r.bye)}</td><td class="num">${f0(r.proj)}</td><td class="num ${r.ev_gain<-15?'b':r.ev_gain<-5?'w':'g'}">${r.ev_gain>=0?'best':r.ev_gain.toFixed(0)}</td><td class="num">${pct(r.surv_next)}</td><td class="num">${pct(r.surv_next2)}</td><td class="num">${r.adp?.toFixed(0)}</td><td class="num">${tierOf(r.espn_id)}</td></tr>`});
 // best available
 const tabs=$('#tabs'); if(!tabs.children.length){['ALL','QB','RB','WR','TE','K','DST'].forEach(p=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>{posF=p;render()};tabs.appendChild(b)})}
 [...tabs.children].forEach(b=>b.classList.toggle('on',b.textContent===posF));
 const bb=$('#best tbody'); bb.innerHTML='';
 S.best.filter(r=>posF==='ALL'||r.pos===posF).slice(0,posF==='ALL'?60:40).forEach(r=>{bb.innerHTML+=`<tr class="row" onclick="pick(${r.espn_id})"><td>${r.name}${r.injury&&r.injury!=='ACTIVE'?` <span class="b">${r.injury[0]}</span>`:''}</td><td><span class="pos ${r.pos}">${r.pos}</span></td><td>${r.nfl}</td><td class="num">${f0(r.bye)}</td><td class="num">${r.tier}</td><td class="num">${f0(r.proj)}</td><td class="num">${f0(r.vorp)}</td><td class="num">${r.adp?r.adp.toFixed(0):'–'}</td><td class="num">${r.fp_ecr?r.fp_ecr.toFixed(0):'–'}</td><td class="num">${pct(r.surv_next)}</td><td><span class="bar"><i style="width:${Math.round((r.surv_next||0)*100)}%"></i></span></td></tr>`});
 // rosters
 const rt=$('#rtabs'); rt.innerHTML=''; const views=['me',...Array.from({length:S.league.teams},(_,i)=>i+1)];
 views.forEach(v=>{const b=document.createElement('button');b.textContent=v==='me'?'Me':v;b.classList.toggle('on',rosterView===v);b.onclick=()=>{rosterView=v;render()};rt.appendChild(b)});
 const slot=rosterView==='me'?S.slot:rosterView; const ros=(S.rosters[slot]||[]).slice();
 const slots=S.league.slots; const rows=[]; const used=new Set();
 const take=(p)=>{let best=null;ros.forEach(x=>{if(!used.has(x.espn_id)&&(p==='FLEX'?['RB','WR','TE'].includes(x.pos):x.pos===p)&&(!best||x.proj>best.proj))best=x});if(best)used.add(best.espn_id);return best};
 ['QB','RB','WR','TE','FLEX','K','DST'].forEach(p=>{for(let i=0;i<slots[p];i++){const x=take(p);rows.push([p,x])}});
 ros.filter(x=>!used.has(x.espn_id)).forEach(x=>rows.push(['BN',x]));
 for(let i=rows.filter(r=>r[0]==='BN').length;i<S.league.bench;i++)rows.push(['BN',null]);
 const byes={}; ros.forEach(x=>{byes[x.bye]=(byes[x.bye]||0)+1});
 $('#roster').innerHTML=`<div class="m" style="padding:4px 10px">${teamName(slot)} · ${ros.length} players · proj starters ${Math.round(rows.filter(r=>r[0]!=='BN'&&r[1]).reduce((a,r)=>a+r[1].proj,0))} · byes: ${Object.entries(byes).map(([b,n])=>`wk${b}×${n}`).join(' ')}</div><table class="roster">${rows.map(([p,x])=>`<tr><td class="m">${p}</td>${x?`<td><span class="pos ${x.pos}">${x.pos}</span> ${x.name}</td><td>${x.nfl}</td><td class="num">${f0(x.bye)}</td><td class="num">${f0(x.proj)}</td>`:'<td class="empty" colspan="4">empty</td>'}</tr>`).join('')}</table>`;
 $('#picks').innerHTML=S.order.slice().reverse().map(o=>`<div>${o.pick}. <span class="${o.slot===S.slot?'g':''}">${teamName(o.slot)}</span> — ${o.name}</div>`).join('');
}
function tierOf(id){const r=S.best.find(x=>x.espn_id===id);return r?r.tier:'–'}
async function pick(id){await api('/api/pick',{espn_id:id});$('#q').value='';$('#sug').hidden=true;refresh()}
$('#undo').onclick=async()=>{await api('/api/undo',{});refresh()};
$('#slot').onchange=async e=>{await api('/api/slot',{slot:+e.target.value});refresh()};
$('#auto').onchange=async e=>{await api('/api/autosync',{on:e.target.checked});refresh()};
$('#sync').onclick=async()=>{await api('/api/sync',{});refresh()};
const q=$('#q'),sug=$('#sug');
function matches(){const v=q.value.trim().toLowerCase();if(!v)return[];return S.best.filter(r=>r.name.toLowerCase().includes(v)).slice(0,8)}
q.oninput=()=>{const m=matches();selIdx=0;sug.hidden=!m.length;sug.innerHTML=m.map((r,i)=>`<div class="${i===0?'sel':''}" onclick="pick(${r.espn_id})">${r.name} <span class="pos ${r.pos}">${r.pos}</span> ${r.nfl} · proj ${f0(r.proj)} · ADP ${r.adp?r.adp.toFixed(0):'–'}</div>`).join('')};
q.onkeydown=e=>{const m=matches();if(e.key==='ArrowDown'){selIdx=Math.min(selIdx+1,m.length-1)}else if(e.key==='ArrowUp'){selIdx=Math.max(selIdx-1,0)}else if(e.key==='Enter'&&m[selIdx]){pick(m[selIdx].espn_id);return}else if(e.key==='Escape'){sug.hidden=true;return}else return;[...sug.children].forEach((d,i)=>d.classList.toggle('sel',i===selIdx));e.preventDefault()};
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){q.focus();e.preventDefault()}});
refresh(); setInterval(refresh,1500);
</script></body></html>
